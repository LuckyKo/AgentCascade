repos:
  # NOTE: isort + yapf were removed — the two formatters produce conflicting
  # import layouts (isort --line-length 120 vs yapf google/column_limit 120),
  # so the hooks rewrote the same file on every commit and never converged.
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: double-quote-string-fixer
      - id: check-merge-conflict
      - id: fix-encoding-pragma
        args: ["--remove"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
  # Guard against tab-indented regions in the WebUI bundle: an ambiguous indent
  # unit lets a line-only insertion re-base a neighbouring block's whitespace and
  # land whitespace-only diff churn (BUG_00305, tests/test_web_ui_indentation.py).
  - repo: local
    hooks:
      - id: webui-js-indent-spaces
        name: web_ui JS uses space indentation (no leading tabs)
        entry: python scripts/check_js_indentation.py
        language: system
        files: ^web_ui/.*\.js$
