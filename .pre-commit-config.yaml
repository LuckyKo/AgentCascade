repos:
  # NOTE: isort + yapf were removed — the two formatters produce conflicting
  # import layouts (isort --line-length 120 vs yapf google/column_limit 120),
  # so the hooks rewrote the same file on every commit and never converged.
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: double-quote-string-fixer
      - id: check-merge-conflict
      - id: fix-encoding-pragma
        args: ["--remove"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
