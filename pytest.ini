[pytest]
# Test suite execution:
#   Basic (no network):              pytest
#   With local LLM server:            pytest -m "skip_if_no_local"
#   With live external APIs:          pytest -m "live_api"
#   Fullstack E2E only:               pytest -m fullstack_e2e --timeout=540
#     (runs in the default suite too; it's timing-variable under xdist and may flake —
#      a failure there is often a flake, re-run single-process to confirm)
#   All tests:                        pytest -m ""
#
# Run tests in parallel using all available CPU cores with per-test timeout.
# Excludes live_api, skip_if_no_local, stress, and extra_* markers by default.
# NOTE: fullstack_e2e is intentionally INCLUDED in the default run (it's a live-server
# streaming E2E test that works under xdist — real HTTP mock + module-scoped fixture).
# It's ~2min and timing-variable; if you want a fast basic run without it, add
# "and not fullstack_e2e" to the -m filter below.
addopts = -n auto --timeout=60 --durations=10 -m "not live_api and not skip_if_no_local and not extra_examples and not extra_tools and not extra_vl and not stress"

# Test discovery paths
testpaths = tests

# Markers used across the test suite
markers =
    live_api: tests that make live network calls to external APIs (excluded by default)
    skip_if_no_local: skip when no local LLM server is available (excluded by default)
    extra_examples: example integration tests (DashScope models, weather APIs, external services)
    extra_tools: tool tests requiring external APIs (SERPER_API_KEY, langchain, image_gen, amap_weather)
    extra_vl: vision-language model tests (VL models with image inputs)
    stress: heavy-concurrency breaker stress tests (excluded by default; run with -m stress)
    fullstack_e2e: full-stack E2E tests requiring single-process execution (excluded by default; run with -m fullstack_e2e -o addopts="")
