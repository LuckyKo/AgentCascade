[pytest]
# Test suite execution:
#   Basic (no network):              pytest
#   With local LLM server:            pytest -m "skip_if_no_local"
#   With live external APIs:          pytest -m "live_api"
#   Fullstack E2E only:               pytest -m fullstack_e2e -o addopts="-n 0" --timeout=540
#     (EXCLUDED from the default run — fixed port 8123 + module-scoped os.environ writes
#      require a single process; xdist workers race on the port/env, so it must not run in parallel)
#   All tests:                        pytest -m ""
#
# Run tests in parallel using all available CPU cores with per-test timeout.
# Excludes live_api, skip_if_no_local, stress, and extra_* markers by default.
# NOTE: fullstack_e2e is EXCLUDED from the default run. Per its test-module docstring it
# pins a fixed port (8123) and does module-scoped os.environ writes, so it MUST run
# single-process — xdist workers race on the port/env. Run it alone single-process with:
#   pytest -m fullstack_e2e -o addopts="-n 0" --timeout=540
addopts = -n auto --timeout=60 --durations=10 -m "not live_api and not skip_if_no_local and not extra_examples and not extra_tools and not extra_vl and not stress and not fullstack_e2e and not serial"

# Test discovery paths
testpaths = tests

# Markers used across the test suite
markers =
    live_api: tests that make live network calls to external APIs (excluded by default)
    skip_if_no_local: skip when no local LLM server is available (excluded by default)
    extra_examples: example integration tests (DashScope models, weather APIs, external services)
    extra_tools: tool tests requiring external APIs (SERPER_API_KEY, langchain, image_gen, amap_weather)
    extra_vl: vision-language model tests (VL models with image inputs)
    stress: heavy-concurrency breaker stress tests (excluded by default; run with -m stress)
    fullstack_e2e: full-stack E2E streaming test (EXCLUDED from the default run; run alone single-process with -m fullstack_e2e -o addopts="-n 0" --timeout=540)
    requires_docker: tests that construct CodeInterpreter (Docker daemon required; __init__ calls _check_docker_availability)
    heavy_concurrency: tests that spawn >=100 raw OS threads; skipped on runners with a low thread limit
    windows_only: tests that exercise Windows-only OS APIs (ctypes.WINFUNCTYPE / console Ctrl+C handler)
    serial: real-process tests that spawn OS process trees and probe them externally (tasklist/CIM/procfs); xdist workers race on PIDs and leak orphans, so run with -p no:cacheprovider -m serial -o addopts="-n 0"
