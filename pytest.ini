[pytest]
# Test suite execution:
#   Basic (no network):              pytest
#   With local LLM server:            pytest -m "skip_if_no_local"
#   With live external APIs:          pytest -m "live_api"
#   All tests:                        pytest -m ""
#
# Run tests in parallel using all available CPU cores with per-test timeout.
# Excludes live_api, skip_if_no_local, and extra_* markers by default.
addopts = -n auto --timeout=60 --durations=10 -m "not live_api and not skip_if_no_local and not extra_examples and not extra_tools and not extra_vl"

# Test discovery paths
testpaths = tests

# Markers used across the test suite
markers =
    live_api: tests that make live network calls to external APIs (excluded by default)
    skip_if_no_local: skip when no local LLM server is available (excluded by default)
    extra_examples: example integration tests (DashScope models, weather APIs, external services)
    extra_tools: tool tests requiring external APIs (SERPER_API_KEY, langchain, image_gen, amap_weather)
    extra_vl: vision-language model tests (VL models with image inputs)