<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1500" height="1000" fill="#f8fafc"/>

  <!-- Title -->
  <text x="750" y="42" font-size="30" font-weight="bold" fill="#0f172a" text-anchor="middle">AgentCascade — Module Architecture</text>
  <text x="750" y="68" font-size="15" fill="#64748b" text-anchor="middle">Multi-agent orchestration system · layered view of the agent_cascade package</text>

  <!-- ================= LAYER 1: CLIENT / INTERFACE ================= -->
  <rect x="40" y="92" width="1420" height="118" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="60" y="118" font-size="14" font-weight="bold" fill="#4338ca">LAYER 1 · CLIENT &amp; INTERFACE</text>

  <!-- Web UI -->
  <rect x="70" y="132" width="360" height="60" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="250" y="156" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Web UI</text>
  <text x="250" y="178" font-size="12.5" fill="#475569" text-anchor="middle">web_ui/ · index.html + app.js (tabs, streaming)</text>

  <!-- API Server -->
  <rect x="560" y="132" width="380" height="60" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="750" y="156" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">API Server</text>
  <text x="750" y="178" font-size="12.5" fill="#475569" text-anchor="middle">api_server.py · ws_handlers.py (state broadcaster)</text>

  <!-- API Router -->
  <rect x="980" y="132" width="450" height="60" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="1205" y="156" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">API Router</text>
  <text x="1205" y="178" font-size="12.5" fill="#475569" text-anchor="middle">api_router.py · multi-endpoint failover + concurrency</text>

  <!-- ================= LAYER 2: ORCHESTRATION CORE ================= -->
  <rect x="40" y="238" width="1420" height="250" rx="10" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5"/>
  <text x="60" y="264" font-size="14" font-weight="bold" fill="#0e7490">LAYER 2 · ORCHESTRATION CORE (the heart)</text>

  <!-- AgentPool -->
  <rect x="70" y="280" width="380" height="185" rx="8" fill="#ffffff" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="260" y="306" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="middle">AgentPool</text>
  <text x="260" y="324" font-size="12" fill="#64748b" text-anchor="middle">pool/core.py · central coordinator</text>
  <line x1="90" y1="334" x2="430" y2="334" stroke="#e2e8f0" stroke-width="1"/>
  <g font-size="12.5" fill="#334155">
    <text x="90" y="356">• instances: Dict[str, AgentInstance]</text>
    <text x="90" y="376">• templates: Dict[str, Assistant]</text>
    <text x="90" y="396">• message_queues (async routing)</text>
    <text x="90" y="416">• _halted_instances (pause/resume)</text>
    <text x="90" y="438" font-weight="bold" fill="#0e7490">delegates to managers →</text>
  </g>

  <!-- ExecutionEngine -->
  <rect x="560" y="280" width="380" height="185" rx="8" fill="#ffffff" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="750" y="306" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="middle">ExecutionEngine</text>
  <text x="750" y="324" font-size="12" fill="#64748b" text-anchor="middle">engine/core.py · unified turn loop (stateless)</text>
  <line x1="580" y1="334" x2="920" y2="334" stroke="#e2e8f0" stroke-width="1"/>
  <g font-size="12.5" fill="#334155">
    <text x="580" y="356">Phase 1 · Setup turn</text>
    <text x="580" y="376">Phase 2 · Pre-LLM checks (halt/loop)</text>
    <text x="580" y="396">Phase 3 · LLM call + injection</text>
    <text x="580" y="416">Phase 4 · Response &amp; tool exec</text>
    <text x="580" y="436">Phase 5 · Post-turn checks → loop</text>
  </g>

  <!-- AgentInstance -->
  <rect x="980" y="280" width="450" height="185" rx="8" fill="#ffffff" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="1205" y="306" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="middle">AgentInstance</text>
  <text x="1205" y="324" font-size="12" fill="#64748b" text-anchor="middle">agent_instance.py · one agent (any role)</text>
  <line x1="1000" y1="334" x2="1410" y2="334" stroke="#e2e8f0" stroke-width="1"/>
  <g font-size="12.5" fill="#334155">
    <text x="1000" y="356">• instance_name / agent_class</text>
    <text x="1000" y="376">• conversation (single source of truth)</text>
    <text x="1000" y="396">• state: IDLE·RUNNING·SLEEPING·…</text>
    <text x="1000" y="416">• parent_instance (cascading tree)</text>
    <text x="1000" y="436">• compression_summary / marker_index</text>
  </g>

  <!-- ================= LAYER 3: CAPABILITY MODULES ================= -->
  <rect x="40" y="516" width="1420" height="180" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="60" y="542" font-size="14" font-weight="bold" fill="#15803d">LAYER 3 · CAPABILITY MODULES (delegated services)</text>

  <!-- Row of capability boxes -->
  <g>
    <!-- Tools -->
    <rect x="70" y="556" width="200" height="118" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="170" y="580" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Tools</text>
    <text x="170" y="600" font-size="11.5" fill="#475569" text-anchor="middle">tools/ + tool_dispatcher.py</text>
    <g font-size="11" fill="#334155" text-anchor="middle">
      <text x="170" y="620">code_interpreter · shell</text>
      <text x="170" y="636">web_search · image_gen</text>
      <text x="170" y="652">doc_parser · mcp_manager</text>
    </g>

    <!-- LLM -->
    <rect x="290" y="556" width="200" height="118" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="390" y="580" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">LLM Providers</text>
    <text x="390" y="600" font-size="11.5" fill="#475569" text-anchor="middle">llm/ + engine/llm_call.py</text>
    <g font-size="11" fill="#334155" text-anchor="middle">
      <text x="390" y="620">oai · dashscope</text>
      <text x="390" y="636">azure · openvino</text>
      <text x="390" y="652">transformers · function_calling</text>
    </g>

    <!-- Compression -->
    <rect x="510" y="556" width="200" height="118" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="610" y="580" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Compression</text>
    <text x="610" y="600" font-size="11.5" fill="#475569" text-anchor="middle">compression/ + compression_exec.py</text>
    <g font-size="11" fill="#334155" text-anchor="middle">
      <text x="610" y="620">forced (95% token) path</text>
      <text x="610" y="636">tool-triggered path</text>
      <text x="610" y="652">cumulative markers · L2 consolidate</text>
    </g>

    <!-- Skills -->
    <rect x="730" y="556" width="200" height="118" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="830" y="580" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Skills</text>
    <text x="830" y="600" font-size="11.5" fill="#475569" text-anchor="middle">skills/ · reusable procedures</text>
    <g font-size="11" fill="#334155" text-anchor="middle">
      <text x="830" y="620">manager · matcher</text>
      <text x="830" y="636">parser · validator</text>
      <text x="830" y="652">advisor (auto-allocator)</text>
    </g>

    <!-- Security -->
    <rect x="950" y="556" width="200" height="118" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="1050" y="580" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Security</text>
    <text x="1050" y="600" font-size="11.5" fill="#475569" text-anchor="middle">security_handler.py</text>
    <g font-size="11" fill="#334155" text-anchor="middle">
      <text x="1050" y="620">Security Advisor agent</text>
      <text x="1050" y="636">approve / reject / advise</text>
      <text x="1050" y="652">reviews sensitive tool calls</text>
    </g>

    <!-- Memory -->
    <rect x="1170" y="556" width="200" height="118" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="1270" y="580" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Memory &amp; Prompts</text>
    <text x="1270" y="600" font-size="11.5" fill="#475569" text-anchor="middle">memory/ · prompts/dna.py</text>
    <g font-size="11" fill="#334155" text-anchor="middle">
      <text x="1270" y="620">agent templates (DNA)</text>
      <text x="1270" y="636">system prompts</text>
      <text x="1270" y="652">.agent_lessons project memory</text>
    </g>
  </g>

  <!-- ================= LAYER 4: PERSISTENCE / INFRA ================= -->
  <rect x="40" y="724" width="1420" height="150" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="60" y="750" font-size="14" font-weight="bold" fill="#b91c1c">LAYER 4 · PERSISTENCE &amp; INFRASTRUCTURE</text>

  <!-- Pool managers -->
  <rect x="70" y="764" width="380" height="92" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="260" y="788" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Pool Managers</text>
  <text x="260" y="806" font-size="11.5" fill="#475569" text-anchor="middle">pool/ (delegated from AgentPool)</text>
  <g font-size="11" fill="#334155" text-anchor="middle">
    <text x="260" y="826">ParallelAgentManager · IdleManager</text>
    <text x="260" y="842">LoggerManager · lifecycle · rollback · session_io</text>
  </g>

  <!-- Loop detection -->
  <rect x="475" y="764" width="300" height="92" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="625" y="788" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Loop Detection</text>
  <text x="625" y="806" font-size="11.5" fill="#475569" text-anchor="middle">*_loop_detect.py · retry_policy.py</text>
  <g font-size="11" fill="#334155" text-anchor="middle">
    <text x="625" y="826">inter-turn + inner-loop + two-phase</text>
    <text x="625" y="842">rollback to stable state on cycles</text>
  </g>

  <!-- Persistence -->
  <rect x="800" y="764" width="300" height="92" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="950" y="788" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Persistence</text>
  <text x="950" y="806" font-size="11.5" fill="#475569" text-anchor="middle">logger/ · pool/session_io.py</text>
  <g font-size="11" fill="#334155" text-anchor="middle">
    <text x="950" y="826">append-only JSONL session logs</text>
    <text x="950" y="842">session resurrection · backups</text>
  </g>

  <!-- Telemetry / Config -->
  <rect x="1125" y="764" width="245" height="92" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="1247" y="788" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Config &amp; Telemetry</text>
  <text x="1247" y="806" font-size="11.5" fill="#475569" text-anchor="middle">settings.py · config_handlers.py</text>
  <g font-size="11" fill="#334155" text-anchor="middle">
    <text x="1247" y="826">telemetry.py · api_endpoints.json</text>
    <text x="1247" y="842">Docker isolation (code_interpreter)</text>
  </g>

  <!-- ================= FLOW ARROWS (drawn first, labels on top) ================= -->
  <!-- Web UI <-> API Server -->
  <line x1="430" y1="162" x2="560" y2="162" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- API Server -> AgentPool -->
  <line x1="690" y1="192" x2="380" y2="278" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- API Router -> LLM providers (down to layer 3), routed to the right side -->
  <line x1="1360" y1="192" x2="470" y2="556" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)" opacity="0.7"/>

  <!-- AgentPool <-> ExecutionEngine -->
  <line x1="450" y1="372" x2="560" y2="372" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ExecutionEngine <-> AgentInstance -->
  <line x1="940" y1="372" x2="980" y2="372" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ExecutionEngine -> Tools (layer 3) -->
  <line x1="600" y1="465" x2="210" y2="556" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)" opacity="0.8"/>

  <!-- ExecutionEngine -> Compression -->
  <line x1="700" y1="465" x2="615" y2="556" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)" opacity="0.8"/>

  <!-- AgentInstance -> Skills/Memory -->
  <line x1="1120" y1="465" x2="835" y2="556" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- Security handler <-> API Server (approval) -->
  <line x1="1055" y1="556" x2="835" y2="192" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- AgentPool -> Pool Managers -->
  <line x1="260" y1="465" x2="260" y2="764" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)" opacity="0.8"/>

  <!-- ExecutionEngine -> Loop detection -->
  <line x1="735" y1="465" x2="630" y2="764" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- AgentInstance -> Persistence (logs) -->
  <line x1="1190" y1="465" x2="955" y2="764" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- ================= FLOW LABELS (on top, with white halo) ================= -->
  <g font-size="11.5" fill="#334155">
    <text x="495" y="152" text-anchor="middle">WebSocket</text>
    <text x="535" y="230" text-anchor="middle">enqueue user msg</text>
  </g>
  <text x="847" y="482" font-size="11.5" fill="#059669" text-anchor="middle">LLM requests (failover)</text>
  <g font-size="11.5" fill="#334155">
    <text x="505" y="364" text-anchor="middle">drives</text>
    <text x="960" y="364" text-anchor="middle">uses</text>
    <text x="410" y="502" text-anchor="middle">execute tool calls</text>
  </g>
  <text x="948" y="512" font-size="11.5" fill="#b45309" text-anchor="middle">approval verdict</text>

  <!-- ================= LEGEND ================= -->
  <rect x="40" y="898" width="1420" height="82" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="924" font-size="13" font-weight="bold" fill="#0f172a">Legend</text>

  <rect x="60" y="938" width="18" height="18" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="86" y="952" font-size="12" fill="#334155">Interface</text>

  <rect x="170" y="938" width="18" height="18" rx="3" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="196" y="952" font-size="12" fill="#334155">Orchestration core</text>

  <rect x="330" y="938" width="18" height="18" rx="3" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="356" y="952" font-size="12" fill="#334155">Capability module</text>

  <rect x="490" y="938" width="18" height="18" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="516" y="952" font-size="12" fill="#334155">Persistence / infra</text>

  <rect x="650" y="938" width="18" height="18" rx="3" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="676" y="952" font-size="12" fill="#334155">Security</text>

  <line x1="780" y1="947" x2="820" y2="947" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="830" y="952" font-size="12" fill="#334155">data / control flow</text>

  <line x1="970" y1="947" x2="1010" y2="947" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="1020" y="952" font-size="12" fill="#334155">LLM request path</text>

  <text x="750" y="972" font-size="11" fill="#94a3b8" text-anchor="middle">Source: agent_cascade/ package · see docs/SYSTEM_DOCS.md for full detail</text>
</svg>
